name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. See SECURITY.md for how to report them privately.
        Please do not paste real metadata, connection strings or credentials. Reduce the
        problem to made-up data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code, command or input file that shows the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: govgraph version
      description: Output of `govgraph --version`, or the commit.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store
      options:
        - In memory
        - PostgreSQL
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The full traceback or message, with anything sensitive removed.
      render: text
