<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network access of any kind: the page is one file and loads nothing. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>govgraph viewer</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1c1c1e; --muted: #6b6b70;
          --line: #c9c9cf; --panel: #ffffff; --accent: #1f5fbf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --fg: #ececf0; --muted: #a0a0a8; --line: #4a4a52;
            --panel: #212126; --accent: #7fb0ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr;
         font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { grid-column: 1 / 3; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
           padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; }
  #summary { color: var(--muted); }
  #warning { color: #b25000; font-weight: 600; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg.panning { cursor: grabbing; }
  .edge { stroke: var(--line); stroke-width: 1.2; }
  .edge.near { stroke: var(--accent); stroke-width: 2; }
  .arrowhead { fill: var(--muted); }
  .edge-label { font-size: 9px; fill: var(--muted); text-anchor: middle; pointer-events: none; }
  .node circle { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }
  .node.root circle { stroke: var(--fg); stroke-width: 2.5; }
  .node.selected circle { stroke: var(--accent); stroke-width: 3.5; }
  .node text { font-size: 11px; fill: var(--fg); pointer-events: none;
               paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .node:focus { outline: none; }
  .node:focus circle { stroke: var(--accent); stroke-width: 3.5; }
  .faded { opacity: 0.15; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto;
          padding: 12px; }
  aside h2 { font-size: 13px; margin: 14px 0 6px; text-transform: uppercase;
             letter-spacing: 0.04em; color: var(--muted); }
  aside h2:first-child { margin-top: 0; }
  #legend { list-style: none; margin: 0; padding: 0; }
  #legend li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  #legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  #details p { margin: 0; color: var(--muted); }
  code { font-size: 11px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>govgraph viewer</h1>
  <span id="summary">No graph loaded.</span>
  <span id="warning" hidden>This export was cut short by a limit, so the graph is incomplete.</span>
  <label>Open an export <input id="file" type="file" accept="application/json,.json"></label>
</header>
<svg id="canvas" role="img" aria-label="Graph of governance metadata">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0 L10 5 L0 10 z"></path>
    </marker>
  </defs>
  <g id="viewport"><g id="edges"></g><g id="nodes"></g></g>
</svg>
<aside>
  <h2>Node types</h2>
  <ul id="legend"></ul>
  <h2>Selected</h2>
  <div id="details"><p>Select a node to see its properties. Drag nodes to move them,
  drag the background to pan and scroll to zoom.</p></div>
</aside>
<script>
const EMBEDDED_GRAPH = /*__GOVGRAPH_DATA__*/null;
/*__GOVGRAPH_VIEWER_JS__*/
</script>
</body>
</html>
